<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Спільна 3D-ялинка</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1b33; font-family: system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; display: block; touch-action: none; }
  #status {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: #fff; background: rgba(0,0,0,.45); padding: 10px 18px; border-radius: 12px;
    font-size: 15px; pointer-events: none; transition: opacity .4s;
  }
  #status.hidden { opacity: 0; }
  #hint {
    position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.7); font-size: 13px; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="status">Завантаження ялинки…</div>
<div id="hint">Обертання: потягніть · Масштаб: коліщатко або щипок</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ===== НАЛАШТУВАННЯ =====
const MODEL_URL   = './models/tree.glb'; // шлях до вашої моделі
const TREE_HEIGHT = 6;                   // потрібна висота ялинки в сцені
// ========================

const canvas = document.getElementById('scene');
const statusEl = document.getElementById('status');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1b33);
scene.fog = new THREE.Fog(0x0f1b33, 20, 45);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, TREE_HEIGHT * 0.7, TREE_HEIGHT * 1.8);

// Світло
scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x2a3a2a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(5, 10, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// Земля (сніг)
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(12, 64),
  new THREE.MeshStandardMaterial({ color: 0xf2f6ff, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Керування камерою (миша + дотик)
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, TREE_HEIGHT * 0.45, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI / 2 - 0.05; // не опускатися під землю
controls.update();

// Проста ялинка з конусів — запасний варіант, якщо модель не завантажилась
function buildFallbackTree() {
  const g = new THREE.Group();
  const green = new THREE.MeshStandardMaterial({ color: 0x2e8b57, flatShading: true });
  const brown = new THREE.MeshStandardMaterial({ color: 0x6b4423, flatShading: true });
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1, 12), brown);
  trunk.position.y = 0.5;
  g.add(trunk);
  const tiers = [[2.2, 2.2, 1.0], [1.8, 2.0, 2.2], [1.4, 1.8, 3.3], [1.0, 1.6, 4.3]];
  for (const [r, h, y] of tiers) {
    const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, 10), green);
    cone.position.y = y + h / 2 - 0.2;
    g.add(cone);
  }
  return g;
}

// Підганяємо модель: розмір, центр, посадка на землю
function fitToScene(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const scale = TREE_HEIGHT / size.y;
  obj.scale.multiplyScalar(scale);
  box.setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  obj.position.x -= center.x;
  obj.position.z -= center.z;
  obj.position.y -= box.min.y;
  obj.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
}

const tree = new THREE.Group();
scene.add(tree);

new GLTFLoader().load(
  MODEL_URL,
  gltf => {
    fitToScene(gltf.scene);
    tree.add(gltf.scene);
    statusEl.classList.add('hidden');
  },
  undefined,
  err => {
    console.warn('Модель не завантажилась, використано запасну ялинку:', err);
    const fb = buildFallbackTree();
    fitToScene(fb);
    tree.add(fb);
    statusEl.textContent = 'Модель не знайдено — показано тимчасову ялинку';
    setTimeout(() => statusEl.classList.add('hidden'), 3500);
  }
);

// Адаптація під розмір екрана
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
